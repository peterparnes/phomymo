# Pho (Phomymo) on Apache. install.sh fills in @TARGET@ and writes the result to
# /etc/apache2/pho.conf, which is included from the phomymo.parnes.com vhost(s).
# Required modules: headers
#
# Pho is a static app: everything runs in the browser and designs are kept in the
# browser's localStorage. Web Bluetooth and WebUSB need HTTPS, so the app must be
# served from the TLS vhost.
<Directory "@TARGET@">
    # Absolute list: nothing inherited from the server config (Includes, ExecCGI,
    # FollowSymLinks, Indexes, MultiViews) applies here.
    Options None
    AllowOverride None
    Require all granted
    DirectoryIndex index.html

    # Every file is static. Handlers the server enables globally for other sites
    # (PHP, CGI, SSI, type maps) must not run anything that ends up in this directory.
    <FilesMatch ".">
        SetHandler None
    </FilesMatch>
    RemoveHandler .php .phtml .phar .cgi .pl .py .shtml .var .asis
    RemoveOutputFilter .shtml

    # Only app.js and handles.js carry ?v= cache busters; the other modules are imported
    # without one. Let browsers keep copies but check with the server (ETag) on every load,
    # so a deploy never leaves a mix of old and new modules.
    <FilesMatch "\.(html|js|mjs|json|css)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    <FilesMatch "\.(png|jpe?g|gif|svg|webp|ico|woff2?)$">
        Header set Cache-Control "public, max-age=86400"
    </FilesMatch>
    # Hidden files and directories (deploy marker, editor/tool folders) and platform files
    # are not part of the app. FilesMatch only sees the last path component, so dot
    # directories are matched on the request path as well.
    <FilesMatch "^(_headers|\..*)$">
        Require all denied
    </FilesMatch>
    <If "%{REQUEST_URI} =~ m#/\.#">
        Require all denied
    </If>
    # Only the file types deploy/build.sh publishes are served at all.
    <If "-f %{REQUEST_FILENAME} && %{REQUEST_FILENAME} !~ m#\.(html|htm|js|mjs|json|css|png|jpe?g|gif|svg|webp|ico|woff2?|txt|map)$#i">
        Require all denied
    </If>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"
    # Do not set Permissions-Policy for bluetooth/usb here: the app needs both.
    @ROBOTS_HEADER@
</Directory>
